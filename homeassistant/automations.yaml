# ======================== MAPOVÁNÍ (uprav časy níže) ========================
# Tlačítko │ Single  │ Double  │ Triple  │ Long
# ---------|---------|---------|---------|--------
# 1        │  5 min  │ 10 min  │ 15 min  │ STOP
# 2        │  6 min  │ 12 min  │ 18 min  │ STOP
# 3        │  7 min  │ 14 min  │ 21 min  │ STOP
# 4        │  8 min  │ 16 min  │ 24 min  │ STOP
# ============================================================================
# UI editor: použij automations_ui.yaml

- id: ro_voda_sonoff_mqtt
  alias: "RO voda — Sonoff MQTT"
  description: "SNZB-01M → ventil + timer (každé tlačítko zvlášť)"
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt/Ovladani_vody_sonoff/action
  conditions: []
  actions:
    - choose:

        # ========== SINGLE PRESS ==========

        - conditions:
            - condition: template
              value_template: "{{ trigger.payload == 'single_button_1' }}"
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.ro_napousteni
            - action: switch.turn_on
              target:
                entity_id: switch.ro_napousteni_vody_ventil_ro
            - action: timer.start
              target:
                entity_id: timer.ro_napousteni
              data:
                duration: "00:05:00"

        - conditions:
            - condition: template
              value_template: "{{ trigger.payload == 'single_button_2' }}"
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.ro_napousteni
