# Dashboard — Napouštění RO (custom:button-card)
#
# Potřebuje: HACS → button-card
# Entity:
#   switch.ro_napousteni_vody_ventil_ro
#   timer.ro_napousteni
#
# Automatizace „RO voda — timer dokončen“ musí běžet (vypne ventil po timeru).
#
# Jak přidat: Dashboard → Upravit → + Přidat kartu → Manual → vložte YAML níže

type: vertical-stack
cards:
  # --- Ventil RO ---
  - type: custom:button-card
    entity: switch.ro_napousteni_vody_ventil_ro
    name: Ventil RO
    icon: mdi:pipe-valve
    show_state: true
    show_icon: true
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      card:
        - height: 70px
        - border-radius: 18px
        - padding: 10px 12px
      grid:
        - grid-template-areas: "\"i n\" \"i s\""
        - grid-template-columns: 42px 1fr
        - grid-template-rows: 1fr 1fr
        - column-gap: 10px
      img_cell:
        - grid-area: i
        - display: flex
        - align-items: center
        - justify-content: center
        - width: 42px
        - height: 50px
      icon:
        - width: 28px
        - height: 28px
        - color: rgba(255,255,255,0.55)
        - justify-self: center
        - align-self: center
      name:
        - font-size: 15px
        - font-weight: 700
        - justify-self: start
        - align-self: end
      state:
        - font-size: 12px
        - color: var(--secondary-text-color)
        - justify-self: start
        - align-self: start
    state:
      - value: "on"
        styles:
          card:
            - background: >-
                linear-gradient(135deg,rgba(33,150,243,0.22),rgba(3,169,244,0.10))
            - box-shadow: 0 0 14px rgba(33,150,243,0.28)
          icon:
            - color: "#64b5f6"
            - filter: drop-shadow(0 0 6px rgba(100,181,246,0.95))
      - value: "off"
        styles:
          icon:
            - color: rgba(255,255,255,0.42)
            - filter: none
          card:
            - box-shadow: none

  # --- Živý odpočet (nad tlačítky s časy) ---
  - type: horizontal-stack
    cards:
      - type: tile
        entity: timer.ro_napousteni
        name: Odpočet
        icon: mdi:timer-outline
        vertical: false
      - type: conditional
        conditions:
          - entity: timer.ro_napousteni
            state: active
        card:
          type: custom:button-card
          icon: mdi:close
          show_name: false
          show_icon: true
          tap_action:
            action: javascript
            javascript: |
              [[[
                hass.callService('timer', 'cancel', { entity_id: 'timer.ro_napousteni' });
                hass.callService('switch', 'turn_off', { entity_id: 'switch.ro_napousteni_vody_ventil_ro' });
              ]]]
          styles:
            card:
              - width: 48px
              - height: 100%
              - min-height: 48px
              - border-radius: 14px
              - padding: 0
              - background: rgba(244,67,54,0.12)
              - border: 1px solid rgba(244,67,54,0.25)
            img_cell:
              - display: flex
              - align-items: center
              - justify-content: center
            icon:
              - width: 20px
              - height: 20px
              - color: "#e57373"

  # --- Rychlé časy ---
  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:button-card
        name: 5 min
        icon: mdi:timer-outline
        show_state: false
        tap_action:
          action: javascript
          javascript: |
            [[[
              const tid = 'timer.ro_napousteni';
              const sid = 'switch.ro_napousteni_vody_ventil_ro';
              hass.callService('timer', 'cancel', { entity_id: tid });
              hass.callService('switch', 'turn_on', { entity_id: sid });
              hass.callService('timer', 'start', { entity_id: tid, duration: '00:05:00' });
            ]]]
        styles:
          card:
            - height: 52px
            - border-radius: 14px
            - padding: 6px
            - background: rgba(33,150,243,0.08)
            - border: 1px solid rgba(33,150,243,0.15)
          grid:
            - grid-template-areas: "\"i\" \"n\""
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr min-content
          icon:
            - color: "#64b5f6"
            - width: 18px
            - height: 18px
          name:
            - font-size: 12px
            - font-weight: 700
            - color: "#ffffff"
      - type: custom:button-card
        name: 10 min
        icon: mdi:timer-outline
        show_state: false
        tap_action:
          action: javascript
          javascript: |
            [[[
              const tid = 'timer.ro_napousteni';
              const sid = 'switch.ro_napousteni_vody_ventil_ro';
              hass.callService('timer', 'cancel', { entity_id: tid });
              hass.callService('switch', 'turn_on', { entity_id: sid });
              hass.callService('timer', 'start', { entity_id: tid, duration: '00:10:00' });
            ]]]
        styles:
          card:
            - height: 52px
            - border-radius: 14px
            - padding: 6px
            - background: rgba(33,150,243,0.08)
            - border: 1px solid rgba(33,150,243,0.15)
          grid:
            - grid-template-areas: "\"i\" \"n\""
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr min-content
          icon:
            - color: "#64b5f6"
            - width: 18px
            - height: 18px
          name:
            - font-size: 12px
            - font-weight: 700
            - color: "#ffffff"
      - type: custom:button-card
        name: 15 min
        icon: mdi:timer-outline
        show_state: false
        tap_action:
          action: javascript
          javascript: |
            [[[
              const tid = 'timer.ro_napousteni';
              const sid = 'switch.ro_napousteni_vody_ventil_ro';
              hass.callService('timer', 'cancel', { entity_id: tid });
              hass.callService('switch', 'turn_on', { entity_id: sid });
              hass.callService('timer', 'start', { entity_id: tid, duration: '00:15:00' });
            ]]]
        styles:
          card:
            - height: 52px
            - border-radius: 14px
            - padding: 6px
            - background: rgba(33,150,243,0.08)
            - border: 1px solid rgba(33,150,243,0.15)
          grid:
            - grid-template-areas: "\"i\" \"n\""
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr min-content
          icon:
            - color: "#64b5f6"
            - width: 18px
            - height: 18px
          name:
            - font-size: 12px
            - font-weight: 700
            - color: "#ffffff"
      - type: custom:button-card
        name: STOP
        icon: mdi:stop-circle-outline
        show_state: false
        tap_action:
          action: javascript
          javascript: |
            [[[
              hass.callService('timer', 'cancel', { entity_id: 'timer.ro_napousteni' });
              hass.callService('switch', 'turn_off', { entity_id: 'switch.ro_napousteni_vody_ventil_ro' });
            ]]]
        styles:
          card:
            - height: 52px
            - border-radius: 14px
            - padding: 6px
            - background: rgba(244,67,54,0.12)
            - border: 1px solid rgba(244,67,54,0.25)
          grid:
            - grid-template-areas: "\"i\" \"n\""
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr min-content
          icon:
            - color: "#e57373"
            - width: 18px
            - height: 18px
          name:
            - font-size: 12px
            - font-weight: 700
            - color: "#ffffff"

  # --- Vlastní čas (modal) ---
  - type: custom:button-card
    icon: mdi:clock-edit-outline
    show_state: false
    show_name: true
    show_icon: true
    name: Vlastní čas…
    variables:
      timer_entity: timer.ro_napousteni
      switch_entity: switch.ro_napousteni_vody_ventil_ro
      title: Napouštění RO
    tap_action:
      action: javascript
      javascript: |
        [[[
          const tid = variables.timer_entity;
          const sid = variables.switch_entity;
          const title = variables.title || 'Časovač';
          const modalId = `ha-timer-modal-${tid.replace(/\./g, '-')}`;

          const old = document.getElementById(modalId);
          if (old) old.remove();

          const hoursOptions = Array.from({ length: 3 }, (_, i) => `<option value="${i}">${i}</option>`).join('');
          const minsOptions = Array.from({ length: 60 }, (_, i) => {
            const selected = i === 5 ? 'selected' : '';
            return `<option value="${i}" ${selected}>${String(i).padStart(2, '0')}</option>`;
          }).join('');

          const modal = document.createElement('div');
          modal.id = modalId;
          modal.style.cssText = `
            position: fixed;
            inset: 0;
            z-index: 999999;
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
          `;

          modal.innerHTML = `
            <div id="timer-box" style="
              width: min(330px, 90vw);
              background: #1c1c1e;
              border-radius: 24px;
              padding: 22px 20px 20px;
              box-shadow: 0 20px 60px rgba(0,0,0,0.7);
              border: 1px solid rgba(255,255,255,0.08);
              color: white;
              font-family: var(--paper-font-body1_-_font-family, Roboto, sans-serif);
            ">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
                <div>
                  <div style="font-size:18px;font-weight:800;">Časovač</div>
                  <div style="font-size:13px;color:rgba(255,255,255,0.45);margin-top:3px;">${title}</div>
                </div>
                <button id="timer-close" style="width:34px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.65);font-size:18px;cursor:pointer;">✕</button>
              </div>
              <div style="font-size:12px;color:rgba(255,255,255,0.45);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px;">Napouštět</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;">
                <label style="display:flex;flex-direction:column;gap:7px;">
                  <span style="font-size:12px;color:rgba(255,255,255,0.45);">Hodiny</span>
                  <select id="timer-hours" style="height:48px;border-radius:14px;background:rgba(255,255,255,0.07);color:white;border:1px solid rgba(255,255,255,0.12);padding:0 12px;font-size:18px;font-weight:700;">${hoursOptions}</select>
                </label>
                <label style="display:flex;flex-direction:column;gap:7px;">
                  <span style="font-size:12px;color:rgba(255,255,255,0.45);">Minuty</span>
                  <select id="timer-mins" style="height:48px;border-radius:14px;background:rgba(255,255,255,0.07);color:white;border:1px solid rgba(255,255,255,0.12);padding:0 12px;font-size:18px;font-weight:700;">${minsOptions}</select>
                </label>
              </div>
              <button id="timer-start" style="width:100%;height:52px;border-radius:15px;background:linear-gradient(135deg,rgba(33,150,243,0.35),rgba(3,169,244,0.18));border:1px solid rgba(33,150,243,0.45);color:#64b5f6;font-size:16px;font-weight:800;letter-spacing:0.05em;cursor:pointer;">SPUSTIT</button>
            </div>
          `;

          document.body.appendChild(modal);
          const close = () => modal.remove();
          modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
          modal.querySelector('#timer-close').addEventListener('click', close);
          modal.querySelector('#timer-start').addEventListener('click', () => {
            const h = Number(modal.querySelector('#timer-hours').value);
            const m = Number(modal.querySelector('#timer-mins').value);
            if (h === 0 && m === 0) {
              window.alert('Vyber čas větší než 0 minut.');
              return;
            }
            const duration = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00`;
            hass.callService('timer', 'cancel', { entity_id: tid });
            hass.callService('switch', 'turn_on', { entity_id: sid });
            hass.callService('timer', 'start', { entity_id: tid, duration: duration });
            close();
          });
        ]]]
    styles:
      card:
        - height: 48px
        - border-radius: 14px
        - padding: 6px 10px
        - background: rgba(255,255,255,0.03)
        - border: 1px solid rgba(255,255,255,0.07)
      grid:
        - grid-template-areas: "\"i n\""
        - grid-template-columns: 26px 1fr
        - column-gap: 6px
      img_cell:
        - display: flex
        - align-items: center
        - justify-content: center
        - width: 24px
        - height: 24px
      icon:
        - width: 18px
        - height: 18px
        - color: "#64b5f6"
      name:
        - font-size: 13px
        - font-weight: 700
        - justify-self: start
        - color: var(--secondary-text-color)
