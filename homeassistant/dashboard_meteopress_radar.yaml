# Dashboard — Meteopress radar (Lovelace)
#
# Jak přidat: Dashboard → Upravit → + Přidat kartu → Manual
#
# POZOR: Některé weby blokují vložení do iframe (X-Frame-Options).
# Pokud uvidíte prázdnou kartu, použijte variantu B (tlačítko) níže.

# --- Varianta A: vložená stránka (iframe / webpage) ---
type: vertical-stack
cards:
  - type: markdown
    content: "## Radar — Meteopress"
  - type: iframe
    url: "https://www.meteopress.cz/radar/#8/49.700/15.600"
    aspect_ratio: 16:9
    title: Meteopress radar

